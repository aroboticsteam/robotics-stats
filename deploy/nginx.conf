events {}
http {
  # Docker's embedded DNS returns every replica; re-resolve so scaling up/down is picked up.
  resolver 127.0.0.11 valid=5s;
  server {
    listen 80;
    set $upstream http://stats:8080;
    location / {
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
